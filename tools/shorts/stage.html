<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{--c:#14583A;--ink:#111418;--bg:#EEF0F3;--dot:#DCE0E6}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:"M PLUS Rounded 1c","Noto Sans CJK TC",sans-serif;color:var(--ink)}
body{background-image:radial-gradient(var(--dot) 3px,transparent 3.4px);background-size:44px 44px}
#top{position:absolute;left:0;right:0;top:64px;height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:12px;font:700 40px "Fredoka",sans-serif}
.chip i{font-style:normal;width:58px;height:58px;border-radius:17px;background:#FF7A3D;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:29px}
#gname{font-weight:800;font-size:54px;line-height:1.05;color:var(--c);letter-spacing:2px;text-align:center}
#phone{position:absolute;left:50%;top:356px;width:390px;height:700px;transform:translateX(-50%) scale(1.9);transform-origin:top center;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 5px #fff,0 0 0 8px color-mix(in srgb,var(--c) 45%,#fff),0 18px 40px rgba(30,36,69,.25);background:#fff}
#app{border:0;width:390px;height:700px;display:block}
#cap{position:absolute;left:44px;right:44px;bottom:44px;min-height:168px;border-radius:34px;background:rgba(30,36,69,.92);color:#fff;font-weight:800;font-size:52px;line-height:1.35;
  display:flex;align-items:center;justify-content:center;text-align:center;text-wrap:balance;padding:22px 34px;box-shadow:0 10px 26px rgba(30,36,69,.3)}
#cap:empty{display:none}
#cap b{color:#FFD23F}
#finger{position:absolute;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(255,255,255,.55);border:5px solid rgba(255,255,255,.95);
  box-shadow:0 6px 18px rgba(30,36,69,.35);pointer-events:none;z-index:20}
#ring{position:absolute;left:0;top:0;border-radius:50%;border:6px solid #fff;pointer-events:none;z-index:19;opacity:0}
.card{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;
  background:var(--bg);background-image:radial-gradient(var(--dot) 3px,transparent 3.4px);background-size:44px 44px;padding:0 70px}
.card.on{display:flex}
.tile{width:330px;height:330px;border-radius:78px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 62%,#fff),var(--c) 70%);box-shadow:0 16px 0 color-mix(in srgb,var(--c) 62%,#000),0 28px 50px rgba(30,36,69,.22)}
.tile svg{width:66%;height:66%}
.big{font-weight:800;font-size:132px;line-height:1.05;color:var(--c)}
.tag{font-weight:800;font-size:58px;line-height:1.4}
.url{font:700 66px "Fredoka",sans-serif;background:#fff;border-radius:28px;padding:22px 40px;box-shadow:0 8px 0 #D8E2F2;color:#14583A}
.pills{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.pills span{background:var(--c);color:#fff;font-weight:800;font-size:44px;border-radius:999px;padding:14px 34px}
.small{font-size:42px;font-weight:700;color:#66708F;line-height:1.5}
</style></head>
<body>
<div id="top"><div class="chip"><i>45</i>Recall</div><div id="gname"></div></div>
<div id="phone"><iframe id="app" name="app" src="about:blank"></iframe></div>
<div id="cap"></div>
<div id="ring"></div><div id="finger" hidden></div>
<div class="card" id="card"></div>
<script>
const q=new URLSearchParams(location.search); document.documentElement.style.setProperty("--c","#"+(q.get("c")||"3D7BFF"));
let press=-1;
window.__f=(x,y)=>{ const f=document.getElementById("finger"),r=document.getElementById("ring"); f.style.transform=`translate(${x}px,${y}px)`;
  if(press>=0){ const k=press/8, s=84+k*90; r.style.width=r.style.height=s+"px"; r.style.transform=`translate(${x-s/2}px,${y-s/2}px)`; r.style.opacity=String(1-k); f.style.background=`rgba(255,255,255,${.85-.3*k})`; press++; if(press>8){ press=-1; r.style.opacity="0"; f.style.background=""; } } };
window.__press=()=>{ press=0; };
window.__cap=t=>{ const c=document.getElementById("cap"); c.innerHTML=t||""; const L=(c.textContent||"").length; c.style.fontSize=(L>46?40:L>32?46:52)+"px"; };
window.__finger=on=>{ document.getElementById("finger").hidden=!on; };
window.__title=t=>{ document.getElementById("gname").textContent=t; };
window.__card=html=>{ const c=document.getElementById("card"); c.innerHTML=html||""; c.classList.toggle("on",!!html); };
window.__app=u=>{ document.getElementById("app").src=u; };
</script>
</body></html>
