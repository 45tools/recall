<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="45 Recall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<title>45 Recall</title>
<style>
:root{
  --bg:#E9EFEA; --panel:#FFFFFF; --ink:#13241A; --muted:#5A6D61; --line:#CFDAD2; --accent:#1C6A43; --accent-ink:#FFFFFF;
  --field:#2A7849; --soft:#E5EFE8; --strong:#13241A; --strong-ink:#FFFFFF; --danger:#D7263D; --star:#E0A100;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; --soft:#1E3326; --strong:#E5EFE8; --strong-ink:#0E1913; --danger:#FF6B7A; --star:#FFD24D; }
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{margin:0}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 8px) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang TC","PingFang SC",system-ui,sans-serif;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
button,select,label{touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 0 calc(100px + env(safe-area-inset-bottom))}

.bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
.bar .sp{flex:1;min-width:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;color:var(--ink);text-decoration:none}
.btn.icon{width:46px;padding:0;min-height:40px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.primary,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.strong{background:var(--strong);border-color:var(--strong);color:var(--strong-ink);font-weight:700}
.btn.ng{color:var(--danger);border-color:var(--danger)}
.btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:transparent;min-height:38px;padding:0 10px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink);position:relative}
.seg button + button{border-left:1px solid var(--line)}
.modes .ic{width:18px;height:18px}
body[data-mode="review"] .modes [data-mode="review"],body[data-mode="add"] .modes [data-mode="add"],body[data-mode="list"] .modes [data-mode="list"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-family:"Barlow Condensed",sans-serif}

.menu{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(10,30,18,.25);padding:6px;display:flex;flex-direction:column;min-width:260px;max-height:calc(100vh - 90px);overflow:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.mi{border:0;background:transparent;text-align:left;min-height:44px;padding:0 14px;font-size:15px;font-weight:500;border-radius:9px;display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none}
.mi:active{background:var(--bg)}
.mi:disabled{opacity:.4}
.mi .v{margin-left:auto;color:var(--muted);font-size:13px}
.mi.accent{color:var(--accent);font-weight:700}
.mi select{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:13px;color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:55}

.panel{margin:8px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:15px}
.tip{margin:10px 14px 0;font-size:12px;line-height:1.6;color:var(--muted)}
[data-pane]{display:none}
body[data-mode="review"] [data-pane="review"],body[data-mode="add"] [data-pane="add"],body[data-mode="list"] [data-pane="list"]{display:block}

/* 復習 */
.today{display:flex;align-items:center;gap:16px}
.today .ring{width:112px;height:112px;border-radius:56px;background:var(--field);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.today .ring b{font-size:52px;line-height:1}
.today .ring span{font-size:12px;opacity:.9}
.today p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{text-align:center;padding:8px 4px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}

/* 追加 */
.shot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shot label{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;position:relative;overflow:hidden;background:var(--bg);text-align:center;padding:8px}
.shot label .ic{width:30px;height:30px;color:var(--accent)}
.shot label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{display:none}
.field{margin-top:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 一覧 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lv{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(14,25,19,.75);color:#fff;font-size:10px;border-radius:6px;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .due{position:absolute;right:5px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.tile.master::after{content:"★";position:absolute;right:6px;top:3px;color:#FFE14D;font-size:17px;text-shadow:0 0 3px #000}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:14px}
.empty .ic{width:40px;height:40px;color:var(--accent)}

/* 下の浮いたバー */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 8px calc(14px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.dockbar{display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(10,30,18,.14);pointer-events:auto;max-width:100%}
.dockbar select{min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 8px;font-size:14px;color:var(--ink);max-width:150px}
body[data-mode="review"] #dockReview,body[data-mode="add"] #dockAdd,body[data-mode="list"] #dockList{display:flex}

/* 復習画面 */
#reviewer{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
#reviewer.on{display:flex}
.rv-top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.rv-top .count{font-size:22px;margin-left:4px}
.rv-top .sp{flex:1}
.rv-frame{flex:1;min-height:0;margin:6px 6px 0;background:var(--field);border-radius:12px;padding:8px;display:flex}
.rv-img{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.rv-img img{max-width:100%;max-height:100%;object-fit:contain}
.rv-img img.zoom{max-width:none;max-height:none;width:200%}
.rv-meta{padding:8px 14px 0;font-size:14px;min-height:30px}
.rv-meta .subj{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:1px 8px;margin-right:6px;font-size:12px}
.rv-dock{display:flex;justify-content:center;padding:10px 8px calc(14px + env(safe-area-inset-bottom))}
.rv-dock .dockbar{display:flex;width:100%;max-width:520px}
.rv-dock .btn{flex:1;min-height:58px;flex-direction:column;gap:0;font-size:17px}
.rv-dock .btn small{font-size:11px;font-weight:500;opacity:.85}
#cropper .rv-dock .btn{flex-direction:row;gap:6px;min-height:52px;font-size:16px}

/* 追加：ページを撮る */
.shotbig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;padding:12px}
.shotbig .ic{width:40px;height:40px;color:var(--accent)}
.shotbig b{font-size:17px}
.shotbig small{font-size:12px;color:var(--muted);line-height:1.5}
label.btn{cursor:pointer}
/* 切り抜き */
#cropper{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
#cropper.on{display:flex}
.cropArea{flex:1;min-height:0;position:relative;margin:4px 6px 0;background:#13241A;border-radius:12px;overflow:hidden;touch-action:none}
#cropImg{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
#cropBox{position:absolute;border:2px solid #FFE14D;box-shadow:0 0 0 9999px rgba(10,20,14,.55);touch-action:none;cursor:move}
#cropBox .h{position:absolute;width:30px;height:30px;touch-action:none}
#cropBox .h::after{content:"";position:absolute;width:14px;height:14px;background:#FFE14D;border-radius:4px;left:8px;top:8px}
#cropBox .tl{left:-15px;top:-15px}#cropBox .tr{right:-15px;top:-15px}#cropBox .bl{left:-15px;bottom:-15px}#cropBox .br{right:-15px;bottom:-15px}
.cropPrev{margin:8px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.prevHead{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
#cropInfo{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
#cropInfo.warn{color:var(--danger);font-weight:700}
.prevBox{max-height:22vh;overflow:auto;border-radius:6px;background:#fff;border:1px solid var(--line)}
#cropCanvas{display:block;width:100%}
#cropMemo{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink)}
/* シート・ダイアログ */
.overlay{position:fixed;inset:0;background:rgba(10,30,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.overlay.on,.overlay.show{display:flex}
.sheet,#sheet .inner{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px;font-size:18px}
#sheet img{width:100%;max-height:40vh;object-fit:contain;background:#fff;border-radius:10px;display:block;margin-bottom:8px;border:1px solid var(--line)}
#sheet .shHead{position:sticky;top:-18px;z-index:2;background:var(--panel);display:flex;align-items:center;gap:6px;margin:-18px -14px 8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#sheet .shHead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#sheet .shHead .btn{min-height:40px}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.closeb{display:flex;width:100%;margin-top:12px}
.help{line-height:1.7;font-size:14px}
.help b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--strong);color:var(--strong-ink);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:95;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.qrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 4px;font-size:13px}
.qrow .btn{min-height:34px;padding:0 10px;font-size:13px}
.qrow .btn.icon{width:34px;min-height:34px}
.qrow .lvname{min-width:4.2em;text-align:center;font-weight:700}
.qrow .sp{flex:1}
.qrow .chip{padding:5px 10px}
.seg.sm button{min-height:34px;font-size:12px;padding:0 9px}
.seg.sm button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.qsize{font-size:12px;color:var(--muted);margin:0 0 6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
#prResult{display:none;margin-top:10px}
.prBar{display:flex;align-items:center;gap:6px;margin-top:10px}
.prBar b{flex:1;font-size:14px}
.prBar .btn{min-height:36px;padding:0 10px;font-size:13px}
.prGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:32vh;overflow:auto;margin-top:6px;padding:2px}
.prT{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;padding:0;background:#fff;opacity:.45}
.prT img{width:100%;height:100%;object-fit:cover;display:block}
.prT.on{border-color:var(--accent);opacity:1}
.prT .ck{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:14px;line-height:22px;text-align:center;font-weight:700;display:none}
.prT.on .ck{display:block}
#prResult.on{display:block}
.panelHead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.panelHead h2{margin:0;flex:1;font-size:15px}
.plans{margin-top:4px}
.plan{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.plan:first-child{border-top:0}
.plan .pt{flex:1;min-width:0}
.plan .pt b{display:block;font-size:12px;color:var(--accent)}
.plan .pt span{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .pt small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan.past .pt b{color:var(--danger)}
.plan .btn{min-height:40px;padding:0 10px}
.plan .btn.icon{width:40px}
.plansEmpty{font-size:13px;color:var(--muted);margin:6px 0 0}
.urlRow{display:flex;gap:6px}
.urlRow input{flex:1;min-width:0}
.urlRow .btn{min-height:44px}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}

/* ===== 2026-11-05 わくわくデザイン ===== */
:root{--hero1:#14583A;--hero2:#2C9A63;--warm:#FF7A3D;--warm2:#FFB547;--sky:#2F7BEA;--gold:#E7A400}
html{overscroll-behavior:none;overflow-x:hidden}
body{overflow-x:hidden;min-height:100dvh}
body{background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
.panel{border-radius:18px;box-shadow:0 2px 0 var(--line)}
.btn{border-radius:12px}
.btn.primary,.btn.pri{box-shadow:0 3px 0 #0F4A2E}
.btn.primary:active:not(:disabled),.btn.pri:active:not(:disabled){transform:translateY(3px);box-shadow:none}
@media (prefers-color-scheme: dark){ .btn.primary,.btn.pri{box-shadow:0 3px 0 #2C7A51} }
.seg.modes{border-radius:14px}
/* 復習：ヒーロー */
.hero{position:relative;margin:8px 10px 0;border-radius:22px;padding:14px 16px 14px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.18),transparent 45%),linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:0 6px 18px rgba(20,88,58,.28)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.6px);background-size:16px 16px;pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero.go{cursor:pointer}
.hero.go:active{transform:scale(.99)}
.heroTop{display:flex;align-items:center;gap:8px;font-size:13px}
.heroTop .sp{flex:1}
.streak{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--warm),var(--warm2));color:#fff;border-radius:999px;padding:3px 11px 3px 7px;font-size:13px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.streak .ic{width:18px;height:18px}
.streak b{font-size:19px;line-height:1}
.streak.zero{background:rgba(255,255,255,.18);box-shadow:none}
.heroDate{opacity:.85}
.heroMain{display:flex;align-items:center;gap:14px;margin-top:10px}
.pring{position:relative;width:118px;height:118px;flex:none}
.pring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:11;stroke-linecap:round}
.pring .trk{stroke:rgba(255,255,255,.2)}
.pring .val{stroke:#FFE14D;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.pring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pring .pc b{font-size:50px;line-height:.95}
.pring .pc span{font-size:12px;opacity:.9}
.pring.clear .pc b{font-size:40px;color:#FFE14D}
.heroTxt{flex:1;min-width:0}
.heroTxt h2{margin:0 0 4px;font-size:22px;line-height:1.25}
.heroTxt p{margin:0;font-size:13px;line-height:1.55;opacity:.92}
.heroGo{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#fff;color:var(--hero1);border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.heroGo .ic{width:18px;height:18px}
.peek{display:flex;gap:0;margin-top:12px;min-height:0;padding:4px 0 4px 8px;overflow:hidden}
.peek:empty{display:none}
.peek img,.peek .more{width:58px;height:58px;border-radius:12px;object-fit:cover;border:3px solid #fff;margin-left:-8px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);flex:none}
.peek img:nth-child(odd){transform:rotate(-4deg)}.peek img:nth-child(even){transform:rotate(3deg)}
.peek .more{display:flex;align-items:center;justify-content:center;color:var(--hero1);font-weight:700;font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;background:rgba(0,0,0,.14);border-radius:14px;padding:7px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;opacity:.9}

let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("photorecall",2);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("cards")) d.createObjectStore("cards",{keyPath:"id"});
      if(!d.objectStoreNames.contains("pages")) d.createObjectStore("pages",{keyPath:"id"}); };
    r.onsuccess=()=>{db=r.result;res()}; r.onerror=()=>rej(r.error);
  });
}
const tx=(mode)=>db.transaction("cards",mode).objectStore("cards");
const dbAll=()=>new Promise(r=>{const q=tx("readonly").getAll(); q.onsuccess=()=>r(q.result||[]);});
const dbPut=c=>new Promise((r,j)=>{const q=tx("readwrite").put(c); q.onsuccess=()=>r(); q.onerror=()=>j(q.error);});
const dbGet=id=>new Promise(r=>{const q=tx("readonly").get(id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null);});
const dbDel=id=>new Promise(r=>{const q=tx("readwrite").delete(id); q.onsuccess=()=>r();});
const ps=mode=>db.transaction("pages",mode).objectStore("pages");
const pagePut=p=>new Promise((r,j)=>{const q=ps("readwrite").put(p); q.onsuccess=()=>r(); q.onerror=()=>j(q.error);});
const pageGet=id=>new Promise(r=>{ if(!id) return r(null); const q=ps("readonly").get(id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null);});

function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{res(img); setTimeout(()=>URL.revokeObjectURL(url),1000)}; img.onerror=rej; img.src=url;
  });
}
async function compress(file,max,q,gray){
  if(max===undefined) [max,q,gray]=qset();
  const img=(file instanceof HTMLCanvasElement)?file:await loadImage(file);
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const k=Math.min(1,max/Math.max(iw,ih));
  const c=document.createElement("canvas"); c.width=Math.round(iw*k); c.height=Math.round(ih*k);
  const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
  if(gray){ const d=ctx.getImageData(0,0,c.width,c.height), a=d.data;
    for(let i=0;i<a.length;i+=4){ const y=a[i]*.299+a[i+1]*.587+a[i+2]*.114; a[i]=a[i+1]=a[i+2]=y; }
    ctx.putImageData(d,0,0); }
  return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q));
}

/* ===== 写真の向き（縦に撮った写真が横にならないように、最初に正しい向きの画像に描き直す） ===== */
// JPEGのEXIFから向き（1〜8）と、回転前の幅・高さを読む
async function exifInfo(file){
  try{
    const buf=new DataView(await file.slice(0,262144).arrayBuffer());
    if(buf.getUint16(0)!==0xFFD8) return {o:1};
    let off=2, o=1, w=0, h=0;
    while(off+4<buf.byteLength){
      const mk=buf.getUint16(off), len=buf.getUint16(off+2);
      if(mk===0xFFE1&&buf.getUint32(off+4)===0x45786966){
        const t0=off+10, le=buf.getUint16(t0)===0x4949, n=buf.getUint16(t0+buf.getUint32(t0+4,le),le);
        for(let i=0;i<n;i++){ const e=t0+buf.getUint32(t0+4,le)+2+i*12; if(buf.getUint16(e,le)===0x0112){ o=buf.getUint16(e+8,le); break; } }
      } else if(mk>=0xFFC0&&mk<=0xFFC3){ h=buf.getUint16(off+5); w=buf.getUint16(off+7); break; }
      if((mk&0xFF00)!==0xFF00) break;
      off+=2+len;
    }
    return {o:(o>=1&&o<=8)?o:1,w,h};
  }catch(e){ return {o:1}; }
}

async function uprightCanvas(file){
  const [img,ex,sup]=await Promise.all([loadImage(file),exifInfo(file),testOrient()]);
  const c=document.createElement("canvas"), x=c.getContext("2d");
  if(sup.drawApplies||ex.o===1){
    c.width=img.naturalWidth; c.height=img.naturalHeight; x.drawImage(img,0,0,c.width,c.height);
  } else {
    // ブラウザが直さないときは自分で回す
    const swap=ex.o>=5, rw=sup.imgApplies&&swap?img.naturalHeight:img.naturalWidth, rh=sup.imgApplies&&swap?img.naturalWidth:img.naturalHeight;
    c.width=swap?rh:rw; c.height=swap?rw:rh;
    const T={2:[-1,0,0,1,rw,0],3:[-1,0,0,-1,rw,rh],4:[1,0,0,-1,0,rh],5:[0,1,1,0,0,0],6:[0,1,-1,0,rh,0],7:[0,-1,-1,0,rh,rw],8:[0,-1,1,0,0,rw]}[ex.o];
    x.setTransform(...T); x.drawImage(img,0,0,rw,rh); x.setTransform(1,0,0,1,0,0);
  }
  c.naturalWidth=c.width; c.naturalHeight=c.height;
  return c;
}
function rotateCanvas(src){
  const c=document.createElement("canvas"); c.width=src.height; c.height=src.width;
  const x=c.getContext("2d"); x.translate(c.width,0); x.rotate(Math.PI/2); x.drawImage(src,0,0);
  c.naturalWidth=c.width; c.naturalHeight=c.height; return c;
}

  const L=LEVELS[crop.lv], blob=await compress(crop.file,L.p[0],L.p[1],crop.gray);
  if(!crop||qKey()!==k) return null;
  crop.pageEnc={key:k,blob,img:await blobImg(blob)}; return crop.pageEnc;
}
function blobImg(blob){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob), im=new Image(); im.onload=()=>{res(im); setTimeout(()=>URL.revokeObjectURL(u),1000);}; im.onerror=rej; im.src=u; }); }

function cropCanvas(maxSide){
  const b=crop.box, [mx,,gray]=cropOpts(), k=Math.min(1,(maxSide||mx)/Math.max(b.w,b.h));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(b.w*k)); c.height=Math.max(1,Math.round(b.h*k));
  const ctx=c.getContext("2d"); ctx.drawImage(crop.img,b.x,b.y,b.w,b.h,0,0,c.width,c.height);
  if(gray){ const d=ctx.getImageData(0,0,c.width,c.height),a=d.data; for(let i=0;i<a.length;i+=4){ const y=a[i]*.299+a[i+1]*.587+a[i+2]*.114; a[i]=a[i+1]=a[i+2]=y; } ctx.putImageData(d,0,0); }
  return c;
}
// 復習画面と同じ「画面幅に合わせた大きさ」で見せて、文字が読めるか確かめてもらう
let prevTimer=null, prevSeq=0;
function drawPreview(){
  clearTimeout(prevTimer); prevTimer=setTimeout(async()=>{
    if(!crop) return;
    const seq=++prevSeq;
    const src=cropCanvas(), cv=$("#cropCanvas"), dpr=window.devicePixelRatio||1, cssW=$("#cropCanvas").parentElement.clientWidth||300;
    const reviewW=Math.min(window.innerWidth,720)-28;            // 復習画面での表示幅
    const [,q]=cropOpts(), cblob=await new Promise(r=>src.toBlob(r,"image/jpeg",q));
    if(seq!==prevSeq||!crop) return;
    let shown=src;
    try{ shown=await blobImg(cblob); }catch(e){}
    if(seq!==prevSeq||!crop) return;
    if(crop.pv==="page"){
      // ページ全体を拡大したときの見え方（囲んだ所を、保存されるページ画像から切り出す）
      $("#qSize").textContent=t("making");
      const pe=await encodePage(); if(seq!==prevSeq||!crop||!pe) return;
      const s=pe.img.naturalWidth/crop.img.naturalWidth, b=crop.box;
      cv.width=Math.max(1,Math.round(b.w*s)); cv.height=Math.max(1,Math.round(b.h*s));
      cv.getContext("2d").drawImage(pe.img,b.x*s,b.y*s,b.w*s,b.h*s,0,0,cv.width,cv.height);
    } else {
      const k=Math.min(1,reviewW*dpr/src.width);                  // 実際に見える解像度
      cv.width=Math.round(src.width*k); cv.height=Math.round(src.height*k);
      cv.getContext("2d").drawImage(shown,0,0,cv.width,cv.height);
    }
    cv.style.width=cssW+"px";
    // 容量：このページ（初回のみ）＋この切り抜き
    const showSize=pe=>{ if(seq!==prevSeq||!crop) return; const pb=crop.keep&&pe&&crop.savedKey!==pe.key?pe.blob.size:0;
      $("#qSize").textContent=t(pb?"sizeInfo":"sizeInfoCrop",{t:mb(pb+cblob.size),p:mb(pb),c:mb(cblob.size)}); };
    if(!crop.keep) showSize(null);
    else if(crop.pageEnc&&crop.pageEnc.key===qKey()) showSize(crop.pageEnc);
    else { $("#qSize").textContent=t("sizeInfoCrop",{c:mb(cblob.size)}); encodePage().then(showSize).catch(()=>{}); }
    // 文字の大きさの目安：切り抜きの幅が狭いほど拡大されて読みやすい。元画像で幅が広すぎる（=縮小される）と警告
    const shrink=src.width/(reviewW*dpr), info=$("#cropInfo");
    const small=crop.box.w/crop.img.naturalWidth>0.85&&crop.box.h/crop.img.naturalHeight>0.5;
    info.textContent=small?t("cropSmall"):t("cropOk",{w:src.width,h:src.height}); info.classList.toggle("warn",small||shrink>2.6);
    if(shrink>2.6) info.textContent=t("cropSmall");
  },60);
}
// 枠の移動・大きさ変更
(()=>{
  const box=$("#cropBox"); let drag=null;
  const pt=e=>({x:(e.clientX-$("#cropArea").getBoundingClientRect().left-view.ox)/view.s,y:(e.clientY-$("#cropArea").getBoundingClientRect().top-view.oy)/view.s});
  box.addEventListener("pointerdown",e=>{ e.preventDefault(); box.setPointerCapture(e.pointerId); drag={h:e.target.dataset.h||"move",p:pt(e),b:{...crop.box}}; });
  box.addEventListener("pointermove",e=>{
    if(!drag) return; const p=pt(e), dx=p.x-drag.p.x, dy=p.y-drag.p.y, b={...drag.b}, W=crop.img.naturalWidth, H=crop.img.naturalHeight, min=40/view.s;
    if(drag.h==="move"){ b.x=Math.min(Math.max(0,b.x+dx),W-b.w); b.y=Math.min(Math.max(0,b.y+dy),H-b.h); }
    else{
      if(drag.h.includes("l")){ const nx=Math.min(Math.max(0,b.x+dx),b.x+b.w-min); b.w+=b.x-nx; b.x=nx; }
      if(drag.h.includes("r")){ b.w=Math.min(Math.max(min,b.w+dx),W-b.x); }
      if(drag.h.includes("t")){ const ny=Math.min(Math.max(0,b.y+dy),b.y+b.h-min); b.h+=b.y-ny; b.y=ny; }
      if(drag.h.includes("b")){ b.h=Math.min(Math.max(min,b.h+dy),H-b.y); }
    }
    crop.box=b; crop.boxTouched=true; drawBox();
  });
  const end=()=>{ drag=null; }; box.addEventListener("pointerup",end); box.addEventListener("pointercancel",end);
  // 枠の外をなぞると、新しく囲み直せる
  const area=$("#cropArea");
  area.addEventListener("pointerdown",e=>{ if(e.target!==area&&e.target!==$("#cropImg")) return; e.preventDefault(); area.setPointerCapture(e.pointerId); const p=pt(e); drag={h:"new",o:p}; });
  area.addEventListener("pointermove",e=>{ if(!drag||drag.h!=="new") return; const p=pt(e), W=crop.img.naturalWidth, H=crop.img.naturalHeight;
    const x0=Math.max(0,Math.min(drag.o.x,p.x)), y0=Math.max(0,Math.min(drag.o.y,p.y)), x1=Math.min(W,Math.max(drag.o.x,p.x)), y1=Math.min(H,Math.max(drag.o.y,p.y));
    if(x1-x0>20/view.s&&y1-y0>20/view.s){ crop.box={x:x0,y:y0,w:x1-x0,h:y1-y0}; drawBox(); } });
  area.addEventListener("pointerup",end); area.addEventListener("pointercancel",end);
})();

const dayKey=(d=new Date())=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function daysGet(){ try{ return JSON.parse(ls.get("pr_days")||"[]"); }catch(e){ return []; } }
function markToday(){ const a=daysGet(), k=dayKey(); if(!a.includes(k)){ a.push(k); ls.set("pr_days",JSON.stringify(a.slice(-400))); } }
function streakN(){
  const set=new Set(daysGet()); let n=0; const d=new Date();
  if(!set.has(dayKey(d))) d.setDate(d.getDate()-1);      // 今日まだでも、昨日まで続いていれば数える
  while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function doneToday(){ const s0=startOfDay(); return cards.filter(c=>c.last&&c.last>=s0).length; }

  $("#heroDate").textContent=new Date().toLocaleDateString(loc,{month:"numeric",day:"numeric",weekday:"short"});
  const ring=$("#ringVal"), C=326.7, frac=total?done/total:0;
  ring.style.strokeDashoffset=String(C*(1-frac));

  $("#dueNum").textContent=clear?"✓":due.length;

// QRコードの写真からリンクを読み取る（端末の中だけで処理）
function loadJsQR(){ return window.jsQR?Promise.resolve():new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="jsqr.js"; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
async function decodeQR(file){
  const img=await loadImage(file);
  if("BarcodeDetector" in window){ try{ const r=await new BarcodeDetector({formats:["qr_code"]}).detect(img); if(r&&r[0]&&r[0].rawValue) return r[0].rawValue; }catch(e){} }
  await loadJsQR();
  const W=img.naturalWidth, H=img.naturalHeight;
  for(const max of [1000,1600,700,2400]){
    const k=Math.min(1,max/Math.max(W,H)), c=document.createElement("canvas"); c.width=Math.round(W*k); c.height=Math.round(H*k);
    const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(img,0,0,c.width,c.height);
    const r=window.jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});
    if(r&&r.data) return r.data;
    if(k===1) break;
  }
  return null;
}

async function renderPrintPages(list,cols,label,bw){
  const PW=1654,PH=2339,M=96,GAP=30,HEAD=70,LH=label?40:0;     // A4・200dpi
  const colW=(PW-2*M-(cols-1)*GAP)/cols, top=M+HEAD, bottom=PH-M;
  const pages=[]; let cv,x,ys;
  const font=`"Zen Kaku Gothic New","Hiragino Sans","Noto Sans CJK JP",sans-serif`;
  const newPage=()=>{ cv=document.createElement("canvas"); cv.width=PW; cv.height=PH; x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,PW,PH); ys=Array(cols).fill(top); pages.push(cv); };
  newPage();
  for(let i=0;i<list.length;i++){
    const c=list[i]; let im; try{ im=await blobImg(c.q); }catch(e){ continue; }
    let w=colW, h=colW*im.naturalHeight/im.naturalWidth;
    const maxH=bottom-top-LH; if(h>maxH){ w=w*maxH/h; h=maxH; }
    let k=ys.indexOf(Math.min(...ys));
    if(ys[k]+LH+h>bottom){ newPage(); k=0; }
    const x0=M+k*(colW+GAP), y0=ys[k];
    if(label){ x.fillStyle="#000"; x.font=`700 24px ${font}`; x.textBaseline="top";
      let txt=`${i+1}. `+[c.subject,c.memo].filter(Boolean).join("　"); while(txt.length>3&&x.measureText(txt).width>colW) txt=txt.slice(0,-2)+"…";
      x.fillText(txt,x0,y0+6); }
    x.drawImage(im,x0,y0+LH,w,h); x.strokeStyle="#bbb"; x.lineWidth=2; x.strokeRect(x0,y0+LH,w,h);
    ys[k]=y0+LH+h+GAP;
  }
  const d=new Date(), ds=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`, fv=$("#filter").value, fname=fv.startsWith("__")?"":fv;
  pages.forEach((pc,i)=>{ const g=pc.getContext("2d");
    g.fillStyle="#000"; g.font=`700 30px ${font}`; g.textBaseline="alphabetic"; g.fillText(["45 Recall",fname,ds].filter(Boolean).join("　"),M,M+34);
    g.font=`500 24px ${font}`; const pn=`${i+1} / ${pages.length}`; g.fillText(pn,PW-M-g.measureText(pn).width,M+34);
    g.strokeStyle="#999"; g.lineWidth=2; g.beginPath(); g.moveTo(M,M+50); g.lineTo(PW-M,M+50); g.stroke();
    if(bw){ const id=g.getImageData(0,0,PW,PH),a=id.data; for(let j=0;j<a.length;j+=4){ const y=a[j]*.299+a[j+1]*.587+a[j+2]*.114; a[j]=a[j+1]=a[j+2]=y; } g.putImageData(id,0,0); } });
  return pages;
}
// 1ページに1枚のJPEGを入れるだけの小さなPDF
function makePDF(jpegs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b=="string")b=enc.encode(b);parts.push(b);len+=b.length};
  const n=jpegs.length,obj=k=>{offs[k]=len;add(`${k} 0 obj\n`)};
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1);add("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  obj(2);add(`<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] >>\nendobj\n`);
  jpegs.forEach((j,i)=>{const pp=3+i*3,im=pp+1,ct=pp+2,cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pp);add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    obj(im);add(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.data.length} >>\nstream\n`);add(j.data);add("\nendstream\nendobj\n");
    obj(ct);add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`)});
  const xref=len,tot=3+n*3;let xr=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let k=1;k<tot;k++)xr+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
  add(xr+`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}

$("#prShare").onclick=async()=>{
  if(!prFile) return;
  if(navigator.canShare&&navigator.canShare({files:[prFile]})){ try{ await navigator.share({files:[prFile],title:"45 Recall"}); return; }catch(e){ if(e.name==="AbortError") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(prFile); a.download=prFile.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},30000);
};

/* ===== アイコンバッジ ===== */
function setBadge(n){ if(ls.get("pr_badge")!=="1"||!navigator.setAppBadge) return; (n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(()=>{}); }
$("#notifBtn").onclick=async()=>{
  if(!navigator.setAppBadge||!("Notification" in window)){ toast(t("badgeNg")); return; }
  try{ const p=await Notification.requestPermission(); if(p==="granted"){ ls.set("pr_badge","1"); toast(t("badgeOk")); refreshAll(); } else toast(t("badgeNg")); }
  catch(e){ toast(t("badgeNg")); }
};

/* ===== 設定・バックアップ ===== */
$("#intervals").onchange=e=>{
  const v=e.target.value.split(/[,、\s]+/).map(s=>parseInt(s,10)).filter(n=>n>0);
  ls.set("pr_int",(v.length?v:DEFAULT_INTERVALS).join(",")); refreshAll();
};
$("#qSel").onchange=e=>ls.set("pr_lv7",e.target.value);
$("#delMastered").onclick=async()=>{
  const ms=cards.filter(c=>c.mastered); if(!ms.length) return;
  if(!confirm(t("confirmDelM",{n:ms.length}))) return;
  for(const c of ms) await delCard(c);
  toast(t("deletedN",{n:ms.length})); reload();
};
$("#delPages").onclick=async()=>{
  if(!pageBytes) return;
  if(!confirm(t("confirmPageDel",{s:(pageBytes/1048576).toFixed(1)+" MB"}))) return;
  toast(t("deleting"));
  for(const c0 of await dbAll()) if(c0.pageId){ c0.pageId=null; await dbPut(c0); }   // 読み直したものを書き戻す
  for(const pg of await pageAll()) await pageDel(pg.id);
  await reload(); toast(t("pageDeleted"));
};
$("#lang").onchange=e=>{lang=e.target.value; ls.set("pr_lang",lang); applyLang();};
const b2d=b=>new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);});
const d2b=async d=>(await fetch(d)).blob();
$("#backup").onclick=async()=>{
  const out=[]; for(const c of [...cards,...reminds]) out.push({...c,q:await b2d(c.q),a:c.a?await b2d(c.a):null});
  const name=`45recall-backup-${new Date().toISOString().slice(0,10)}.json`;
  const pages=[]; for(const p of await pageAll()) pages.push({id:p.id,created:p.created,blob:await b2d(p.blob)});
  const json=JSON.stringify({app:"photorecall",v:3,intervals:intervals(),cards:out,pages,plans:plansGet()});
  const file=new File([json],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; } }
  saveFile(json,name,"application/json");
};
$("#restoreFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); let n=0;
    for(const p of data.pages||[]){ await pagePut({id:p.id,created:p.created,blob:await d2b(p.blob)}); }
    for(const c of data.cards||[]){ c.q=await d2b(c.q); c.a=c.a?await d2b(c.a):null; await dbPut(c); n++; }
    if(Array.isArray(data.plans)){ const m=new Map(plansGet().map(x=>[x.id,x])); data.plans.forEach(x=>m.set(x.id,x)); plansSet([...m.values()]); }
    toast(t("restored",{n})); reload();
  }catch(err){ alert("Error: "+err.message); }
};

function toast(msg){const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2200);}

/* ===== 起動 ===== */
$("#supportLink").href=SUPPORT_URL; $("#verLbl").textContent="45tools · ver "+APP_VER;
$("#subj").value=ls.get("pr_lastSubj")||"";
(async()=>{
  await openDB();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  setMode(ls.get("pr_mode")||"review");
  applyLang(); await reload();
  if(location.hash==="#review" && cards.some(isDue)) $("#startReview").click();
})();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&db) reload(); });
// 新しい版が出たらすぐ使う（アプリを開いたとき・戻ったときに確認。編集中は勝手に再読み込みしない）
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded) return; if(!(document.querySelector("#reviewer.on,#cropper.on"))){ reloaded=true; location.reload(); } });
}
window.__pr={get cards(){return cards},reload,nextInfo,startOfDay};
</script>
