<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="45 Recall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<title>45 Recall</title>
<style>
:root{
  --bg:#E9EFEA; --panel:#FFFFFF; --ink:#13241A; --muted:#5A6D61; --line:#CFDAD2; --accent:#1C6A43; --accent-ink:#FFFFFF;
  --field:#2A7849; --soft:#E5EFE8; --strong:#13241A; --strong-ink:#FFFFFF; --danger:#D7263D; --star:#E0A100;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; --soft:#1E3326; --strong:#E5EFE8; --strong-ink:#0E1913; --danger:#FF6B7A; --star:#FFD24D; }
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{margin:0}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 8px) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang TC","PingFang SC",system-ui,sans-serif;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
button,select,label{touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 0 calc(100px + env(safe-area-inset-bottom))}

.bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
.bar .sp{flex:1;min-width:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;color:var(--ink);text-decoration:none}
.btn.icon{width:46px;padding:0;min-height:40px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.primary,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.strong{background:var(--strong);border-color:var(--strong);color:var(--strong-ink);font-weight:700}
.btn.ng{color:var(--danger);border-color:var(--danger)}
.btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:transparent;min-height:38px;padding:0 10px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink);position:relative}
.seg button + button{border-left:1px solid var(--line)}
.modes .ic{width:18px;height:18px}
body[data-mode="review"] .modes [data-mode="review"],body[data-mode="add"] .modes [data-mode="add"],body[data-mode="list"] .modes [data-mode="list"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-family:"Barlow Condensed",sans-serif}

.menu{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(10,30,18,.25);padding:6px;display:flex;flex-direction:column;min-width:260px;max-height:calc(100vh - 90px);overflow:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.mi{border:0;background:transparent;text-align:left;min-height:44px;padding:0 14px;font-size:15px;font-weight:500;border-radius:9px;display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none}
.mi:active{background:var(--bg)}
.mi:disabled{opacity:.4}
.mi .v{margin-left:auto;color:var(--muted);font-size:13px}
.mi.accent{color:var(--accent);font-weight:700}
.mi select{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:13px;color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:55}

.panel{margin:8px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:15px}
.tip{margin:10px 14px 0;font-size:12px;line-height:1.6;color:var(--muted)}
[data-pane]{display:none}
body[data-mode="review"] [data-pane="review"],body[data-mode="add"] [data-pane="add"],body[data-mode="list"] [data-pane="list"]{display:block}

/* 復習 */
.today{display:flex;align-items:center;gap:16px}
.today .ring{width:112px;height:112px;border-radius:56px;background:var(--field);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.today .ring b{font-size:52px;line-height:1}
.today .ring span{font-size:12px;opacity:.9}
.today p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{text-align:center;padding:8px 4px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}

/* 追加 */
.shot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shot label{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;position:relative;overflow:hidden;background:var(--bg);text-align:center;padding:8px}
.shot label .ic{width:30px;height:30px;color:var(--accent)}
.shot label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{display:none}
.field{margin-top:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 一覧 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lv{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(14,25,19,.75);color:#fff;font-size:10px;border-radius:6px;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .due{position:absolute;right:5px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.tile.master::after{content:"★";position:absolute;right:6px;top:3px;color:#FFE14D;font-size:17px;text-shadow:0 0 3px #000}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:14px}
.empty .ic{width:40px;height:40px;color:var(--accent)}

/* 下の浮いたバー */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 8px calc(14px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.dockbar{display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(10,30,18,.14);pointer-events:auto;max-width:100%}
.dockbar select{min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 8px;font-size:14px;color:var(--ink);max-width:150px}
body[data-mode="review"] #dockReview,body[data-mode="add"] #dockAdd,body[data-mode="list"] #dockList{display:flex}

/* 復習画面 */
#reviewer{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
#reviewer.on{display:flex}
.rv-top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.rv-top .count{font-size:22px;margin-left:4px}
.rv-top .sp{flex:1}
.rv-frame{flex:1;min-height:0;margin:6px 6px 0;background:var(--field);border-radius:12px;padding:8px;display:flex}
.rv-img{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.rv-img img{max-width:100%;max-height:100%;object-fit:contain}
.rv-img img.zoom{max-width:none;max-height:none;width:200%}
.rv-meta{padding:8px 14px 0;font-size:14px;min-height:30px}
.rv-meta .subj{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:1px 8px;margin-right:6px;font-size:12px}
.rv-dock{display:flex;justify-content:center;padding:10px 8px calc(14px + env(safe-area-inset-bottom))}
.rv-dock .dockbar{display:flex;width:100%;max-width:520px}
.rv-dock .btn{flex:1;min-height:58px;flex-direction:column;gap:0;font-size:17px}
.rv-dock .btn small{font-size:11px;font-weight:500;opacity:.85}

/* 追加：ページを撮る */
.shotbig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;padding:12px}
.shotbig .ic{width:40px;height:40px;color:var(--accent)}
.shotbig b{font-size:17px}
.shotbig small{font-size:12px;color:var(--muted);line-height:1.5}
label.btn{cursor:pointer}
/* 切り抜き */
#cropper{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
#cropper.on{display:flex}
.cropArea{flex:1;min-height:0;position:relative;margin:4px 6px 0;background:#13241A;border-radius:12px;overflow:hidden;touch-action:none}
#cropImg{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
#cropBox{position:absolute;border:2px solid #FFE14D;box-shadow:0 0 0 9999px rgba(10,20,14,.55);touch-action:none;cursor:move}
#cropBox .h{position:absolute;width:30px;height:30px;touch-action:none}
#cropBox .h::after{content:"";position:absolute;width:14px;height:14px;background:#FFE14D;border-radius:4px;left:8px;top:8px}
#cropBox .tl{left:-15px;top:-15px}#cropBox .tr{right:-15px;top:-15px}#cropBox .bl{left:-15px;bottom:-15px}#cropBox .br{right:-15px;bottom:-15px}
.cropPrev{margin:8px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.prevHead{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
#cropInfo{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
#cropInfo.warn{color:var(--danger);font-weight:700}
.prevBox{max-height:22vh;overflow:auto;border-radius:6px;background:#fff;border:1px solid var(--line)}
#cropCanvas{display:block;width:100%}
#cropMemo{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink)}
/* シート・ダイアログ */
.overlay{position:fixed;inset:0;background:rgba(10,30,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.overlay.on,.overlay.show{display:flex}
.sheet,#sheet .inner{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px;font-size:18px}
#sheet img{width:100%;border-radius:10px;display:block;margin-bottom:8px;border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.closeb{display:flex;width:100%;margin-top:12px}
.help{line-height:1.7;font-size:14px}
.help b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--strong);color:var(--strong-ink);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:95;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
</style>
</head>
<body data-mode="review">
<div class="bar">
  <div class="seg modes" role="group" aria-label="mode">
    <button data-mode="review"><i class="ic" data-ic="repeat"></i><span data-i="mReview"></span><span class="badge num" id="navBadge" hidden>0</span></button>
    <button data-mode="add"><i class="ic" data-ic="camera"></i><span data-i="mAdd"></span></button>
    <button data-mode="list"><i class="ic" data-ic="grid"></i><span data-i="mList"></span></button>
  </div>
  <button class="btn icon" id="undoBtn" aria-label="undo"><i class="ic" data-ic="undo"></i></button>
  <div class="sp"></div>
  <button class="btn icon" id="menuBtn" aria-label="menu" aria-expanded="false"><i class="ic" data-ic="menu"></i></button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="menu" id="menu" role="menu" hidden>
  <button class="mi" id="remMenuBtn" role="menuitem"><i class="ic" data-ic="bell"></i><span data-i="remindTitle"></span></button>
  <button class="mi" id="intMenuBtn" role="menuitem"><i class="ic" data-ic="clock"></i><span data-i="intTitle"></span><span class="v num" id="intV"></span></button>
  <label class="mi"><i class="ic" data-ic="image"></i><span data-i="qMenu"></span>
    <select id="qSel"><option value="std" data-i="qStdShort"></option><option value="high" data-i="qHighShort"></option><option value="eco" data-i="qEcoShort"></option></select></label>
  <button class="mi" id="delMastered" role="menuitem"></button>
  <hr>
  <button class="mi" id="backup" role="menuitem"><i class="ic" data-ic="download"></i><span data-i="backup"></span></button>
  <label class="mi"><i class="ic" data-ic="upload"></i><span data-i="restore"></span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
  <hr>
  <label class="mi"><span data-i="langLbl"></span>
    <select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh">简体中文</option></select></label>
  <button class="mi" id="helpBtn" role="menuitem"><i class="ic" data-ic="help"></i><span data-i="helpLong"></span></button>
  <a class="mi accent" id="supportLink" role="menuitem" target="_blank" rel="noopener"><i class="ic" data-ic="heart"></i><span data-i="support"></span></a>
</div>

<div class="wrap">
  <!-- 復習 -->
  <section data-pane="review">
    <div class="panel">
      <div class="today">
        <div class="ring"><b class="num" id="dueNum">0</b><span data-i="dueToday"></span></div>
        <p id="todayText"></p>
      </div>
      <div class="stats">
        <div class="stat"><b class="num" id="sTotal">0</b><span data-i="sTotal"></span></div>
        <div class="stat"><b class="num" id="sTomorrow">0</b><span data-i="sTomorrow"></span></div>
        <div class="stat"><b class="num" id="sMaster">0</b><span data-i="sMaster"></span></div>
      </div>
    </div>
    <p class="tip" data-i="tipReview"></p>
  </section>

  <!-- 追加 -->
  <section data-pane="add">
    <div class="panel">
      <label class="shotbig" for="camFile"><i class="ic" data-ic="camera"></i><b data-i="shootPage"></b><small data-i="shootPageD"></small></label>
      <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
      <div class="field"><label for="subj" data-i="subject"></label>
        <input id="subj" list="subjList" autocomplete="off"><datalist id="subjList"></datalist>
        <div class="chips" id="subjChips"></div>
      </div>
    </div>
    <p class="tip" data-i="tipAdd"></p>
  </section>

  <!-- 一覧 -->
  <section data-pane="list">
    <div class="panel">
      <div class="grid" id="grid"></div>
      <div class="empty" id="listEmpty"><i class="ic" data-ic="grid"></i><p data-i="noCards"></p></div>
    </div>
    <p class="tip" data-i="tipList"></p>
  </section>
  <div class="foot">© 45tools</div>
</div>

<!-- 下の浮いたバー -->
<div class="dock">
  <div class="dockbar" id="dockReview">
    <button class="btn" id="extraReview"><i class="ic" data-ic="eye"></i><span data-i="extraShort"></span></button>
    <button class="btn primary" id="startReview"><i class="ic" data-ic="play"></i><span data-i="start"></span></button>
  </div>
  <div class="dockbar" id="dockAdd">
    <label class="btn"><i class="ic" data-ic="image"></i><span data-i="bulkShort"></span><input type="file" id="bulkFile" accept="image/*" multiple hidden></label>
    <label class="btn primary" for="camFile"><i class="ic" data-ic="camera"></i><span data-i="shootShort"></span></label>
  </div>
  <div class="dockbar" id="dockList">
    <select id="filter" aria-label="filter"></select>
    <button class="btn primary" id="listReview"><i class="ic" data-ic="play"></i><span data-i="listReview"></span></button>
  </div>
</div>

<!-- 復習画面 -->
<div id="reviewer">
  <div class="rv-top">
    <button class="btn icon" id="rvClose" aria-label="close"><i class="ic" data-ic="x"></i></button>
    <span class="count num" id="rvCount"></span>
    <span class="sp"></span>
    <button class="btn icon" id="rvUndo" aria-label="undo"><i class="ic" data-ic="undo"></i></button>
    <button class="btn" id="rvAnswer"></button>
  </div>
  <div class="rv-frame"><div class="rv-img" id="rvImgWrap"><img id="rvImg" alt=""></div></div>
  <div class="rv-meta" id="rvMeta"></div>
  <div class="rv-dock"><div class="dockbar">
    <button class="btn ng" id="rvNg"><span data-i="ng"></span><small id="rvNgSub"></small></button>
    <button class="btn primary" id="rvOk"><span data-i="ok"></span><small id="rvOkSub"></small></button>
  </div></div>
</div>

<!-- 切り抜き -->
<div id="cropper">
  <div class="rv-top">
    <button class="btn icon" id="cropCancel" aria-label="close"><i class="ic" data-ic="x"></i></button>
    <b data-i="cropTitle"></b><span class="num" id="cropCount" style="color:var(--muted)"></span>
    <span class="sp"></span>
    <button class="btn" id="cropRetake"><i class="ic" data-ic="camera"></i><span data-i="retake"></span></button>
  </div>
  <div class="cropArea" id="cropArea">
    <img id="cropImg" alt="">
    <div id="cropBox"><span class="h tl" data-h="tl"></span><span class="h tr" data-h="tr"></span><span class="h bl" data-h="bl"></span><span class="h br" data-h="br"></span></div>
  </div>
  <div class="cropPrev">
    <div class="prevHead"><b data-i="cropPrev"></b><span id="cropInfo"></span></div>
    <div class="prevBox"><canvas id="cropCanvas"></canvas></div>
    <input id="cropMemo" data-ph="memoPh" autocomplete="off">
  </div>
  <div class="rv-dock"><div class="dockbar">
    <button class="btn" id="cropDone"><span data-i="cropDone"></span></button>
    <button class="btn primary" id="cropAdd"><i class="ic" data-ic="plus"></i><span data-i="cropAdd"></span></button>
  </div></div>
</div>

<!-- カード詳細 -->
<div id="sheet" class="overlay"><div class="inner" id="sheetInner"></div></div>

<!-- リマインダー -->
<div class="overlay" id="remSheet"><div class="sheet">
  <h2 data-i="remindTitle"></h2>
  <p class="muted" data-i="remindText" style="margin-top:0"></p>
  <div class="field"><label for="remTime" data-i="remindTime"></label><input type="time" id="remTime" value="20:00"></div>

/* ===== IndexedDB ===== */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("photorecall",2);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("cards")) d.createObjectStore("cards",{keyPath:"id"});
      if(!d.objectStoreNames.contains("pages")) d.createObjectStore("pages",{keyPath:"id"}); };
    r.onsuccess=()=>{db=r.result;res()}; r.onerror=()=>rej(r.error);
  });
}
const tx=(mode)=>db.transaction("cards",mode).objectStore("cards");
const dbAll=()=>new Promise(r=>{const q=tx("readonly").getAll(); q.onsuccess=()=>r(q.result||[]);});
const dbPut=c=>new Promise((r,j)=>{const q=tx("readwrite").put(c); q.onsuccess=()=>r(); q.onerror=()=>j(q.error);});
const dbDel=id=>new Promise(r=>{const q=tx("readwrite").delete(id); q.onsuccess=()=>r();});
const ps=mode=>db.transaction("pages",mode).objectStore("pages");
const pagePut=p=>new Promise((r,j)=>{const q=ps("readwrite").put(p); q.onsuccess=()=>r(); q.onerror=()=>j(q.error);});
const pageGet=id=>new Promise(r=>{ if(!id) return r(null); const q=ps("readonly").get(id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null);});
const pageAll=()=>new Promise(r=>{const q=ps("readonly").getAll(); q.onsuccess=()=>r(q.result||[]);});
const pageDel=id=>new Promise(r=>{const q=ps("readwrite").delete(id); q.onsuccess=()=>r(); q.onerror=()=>r();});
// カードを消すとき、そのページを使うカードがもう無ければページも消す
async function delCard(c){ await dbDel(c.id); if(c.pageId){ const left=(await dbAll()).some(x=>x.pageId===c.pageId); if(!left) await pageDel(c.pageId); } }

/* ===== 日付・スケジュール ===== */
const DAY=86400000;
function startOfDay(d=new Date()){const x=new Date(d); x.setHours(0,0,0,0); return x.getTime();}
function intervals(){
  const v=(ls.get("pr_int")||"").split(",").map(s=>parseInt(s,10)).filter(n=>n>0);
  return v.length?v:DEFAULT_INTERVALS;
}
const isDue=c=>!c.mastered && c.due<=startOfDay()+DAY-1;
function nextInfo(c,ok){
  const iv=intervals();
  if(!ok) return {level:0,due:startOfDay()+DAY,mastered:false,label:t("tomorrow")};
  const lv=c.level+1;
  if(lv>=iv.length) return {level:lv,due:Infinity,mastered:true,label:t("mastered")};
  return {level:lv,due:startOfDay()+iv[lv]*DAY,mastered:false,label:t("nextIn",{n:iv[lv]})};
}
function dueLabel(c){
  if(c.mastered) return "★";
  const d=Math.round((startOfDay(new Date(c.due))-startOfDay())/DAY);
  return d<0?t("overdue"):d===0?t("today"):t("days",{n:d});
}

/* ===== 画像処理 ===== */
function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{res(img); setTimeout(()=>URL.revokeObjectURL(url),1000)}; img.onerror=rej; img.src=url;
  });
}
async function compress(file,max,q,gray){
  if(max===undefined) [max,q,gray]=qset();
  const img=await loadImage(file);
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
  if(gray){ const d=ctx.getImageData(0,0,c.width,c.height), a=d.data;
    for(let i=0;i<a.length;i+=4){ const y=a[i]*.299+a[i+1]*.587+a[i+2]*.114; a[i]=a[i+1]=a[i+2]=y; }
    ctx.putImageData(d,0,0); }
  return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q));
}
async function thumbOf(blob){
  const b=await compress(blob,360,.7);
  return new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);});
}

  const bytes=cards.reduce((a,c)=>a+(c.q?c.q.size:0)+(c.a?c.a.size:0)+(c.thumb?c.thumb.length*0.75:0),0)+pageBytes;
  $("#usage").textContent=t("usage",{n:cards.length,s:(bytes/1048576).toFixed(1)});
  const nm=cards.filter(c=>c.mastered).length; $("#delMastered").innerHTML=`<i class="ic">${ico("trash")}</i><span></span><span class="v"></span>`; $("#delMastered").children[1].textContent=t("delMasteredShort",{n:nm}); $("#delMastered").children[2].textContent=(bytes/1048576).toFixed(1)+" MB"; $("#delMastered").disabled=!nm;
  $("#qSel").value=ls.get("pr_q")||"std";

// 画質：切り抜き [長辺, 品質, 白黒] / ページ全体は qset() を使う
const CROPQ={std:[1600,0.85,false],high:[2200,0.9,false],eco:[1200,0.72,true]};
function newCard(q,thumb,pageId,memo){
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),created:Date.now(),
    subject:$("#subj").value.trim(),memo:memo||"",q,a:null,pageId,thumb,level:0,due:startOfDay()+intervals()[0]*DAY,mastered:false,reviews:0};
}
let cropQueue=[], crop=null;   // crop: {img, file, pageId, added, box:{x,y,w,h}(元画像の座標)}
$("#camFile").onchange=e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) startCrop(f); };
$("#bulkFile").onchange=e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) startCrop(f); };
async function startCrop(files){ cropQueue=files.slice(); cropQueue.total=files.length; await nextCrop(); }
async function nextCrop(){
  const f=cropQueue.shift(); if(!f){ closeCrop(); return; }
  let img; try{ img=await loadImage(f); }catch(e){ toast("Error"); return nextCrop(); }
  const W=img.naturalWidth, H=img.naturalHeight;
  crop={img,file:f,pageId:null,added:0,box:{x:W*.1,y:H*.35,w:W*.8,h:H*.22}};
  $("#cropImg").src=img.src; $("#cropMemo").value="";
  const n=cropQueue.total-cropQueue.length;
  $("#cropCount").textContent=cropQueue.total>1?` ${n}/${cropQueue.total}`:"";
  $("#cropDone").lastChild.textContent=t(cropQueue.length?"cropNext":"cropDone");
  $("#cropper").classList.add("on");
  requestAnimationFrame(layoutCrop);
}
function closeCrop(){ $("#cropper").classList.remove("on"); crop=null; cropQueue=[]; reload(); }
// 表示上の位置と元画像の座標の変換
let view={s:1,ox:0,oy:0};
function layoutCrop(){
  if(!crop) return;
  const a=$("#cropArea").getBoundingClientRect(), W=crop.img.naturalWidth, H=crop.img.naturalHeight;
  const sc=Math.min(a.width/W,a.height/H); view={s:sc,ox:(a.width-W*sc)/2,oy:(a.height-H*sc)/2};
  const im=$("#cropImg"); im.style.width=W*sc+"px"; im.style.height=H*sc+"px"; im.style.left=view.ox+"px"; im.style.top=view.oy+"px";
  drawBox();
}
window.addEventListener("resize",()=>{ if(crop) layoutCrop(); });
function drawBox(){
  const b=crop.box, el=$("#cropBox");
  el.style.left=view.ox+b.x*view.s+"px"; el.style.top=view.oy+b.y*view.s+"px"; el.style.width=b.w*view.s+"px"; el.style.height=b.h*view.s+"px";
  drawPreview();
}
function cropOpts(){ return CROPQ[ls.get("pr_q")]||CROPQ.std; }
function cropCanvas(maxSide){
  const b=crop.box, [mx,,gray]=cropOpts(), k=Math.min(1,(maxSide||mx)/Math.max(b.w,b.h));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(b.w*k)); c.height=Math.max(1,Math.round(b.h*k));
  const ctx=c.getContext("2d"); ctx.drawImage(crop.img,b.x,b.y,b.w,b.h,0,0,c.width,c.height);
  if(gray){ const d=ctx.getImageData(0,0,c.width,c.height),a=d.data; for(let i=0;i<a.length;i+=4){ const y=a[i]*.299+a[i+1]*.587+a[i+2]*.114; a[i]=a[i+1]=a[i+2]=y; } ctx.putImageData(d,0,0); }
  return c;
}
// 復習画面と同じ「画面幅に合わせた大きさ」で見せて、文字が読めるか確かめてもらう
let prevTimer=null;
function drawPreview(){
  clearTimeout(prevTimer); prevTimer=setTimeout(()=>{
    if(!crop) return;
    const src=cropCanvas(), cv=$("#cropCanvas"), dpr=window.devicePixelRatio||1, cssW=$("#cropCanvas").parentElement.clientWidth||300;
    const reviewW=Math.min(window.innerWidth,720)-28;            // 復習画面での表示幅
    const k=Math.min(1,reviewW*dpr/src.width);                    // 実際に見える解像度
    cv.width=Math.round(src.width*k); cv.height=Math.round(src.height*k);
    cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
    cv.style.width=cssW+"px";
    // 文字の大きさの目安：切り抜きの幅が狭いほど拡大されて読みやすい。元画像で幅が広すぎる（=縮小される）と警告
    const shrink=src.width/(reviewW*dpr), info=$("#cropInfo");
    const small=crop.box.w/crop.img.naturalWidth>0.85&&crop.box.h/crop.img.naturalHeight>0.5;
    info.textContent=small?t("cropSmall"):t("cropOk",{w:src.width,h:src.height}); info.classList.toggle("warn",small||shrink>2.6);
    if(shrink>2.6) info.textContent=t("cropSmall");
  },60);
}
// 枠の移動・大きさ変更
(()=>{
  const box=$("#cropBox"); let drag=null;
  const pt=e=>({x:(e.clientX-$("#cropArea").getBoundingClientRect().left-view.ox)/view.s,y:(e.clientY-$("#cropArea").getBoundingClientRect().top-view.oy)/view.s});
  box.addEventListener("pointerdown",e=>{ e.preventDefault(); box.setPointerCapture(e.pointerId); drag={h:e.target.dataset.h||"move",p:pt(e),b:{...crop.box}}; });
  box.addEventListener("pointermove",e=>{
    if(!drag) return; const p=pt(e), dx=p.x-drag.p.x, dy=p.y-drag.p.y, b={...drag.b}, W=crop.img.naturalWidth, H=crop.img.naturalHeight, min=40/view.s;
    if(drag.h==="move"){ b.x=Math.min(Math.max(0,b.x+dx),W-b.w); b.y=Math.min(Math.max(0,b.y+dy),H-b.h); }
    else{
      if(drag.h.includes("l")){ const nx=Math.min(Math.max(0,b.x+dx),b.x+b.w-min); b.w+=b.x-nx; b.x=nx; }
      if(drag.h.includes("r")){ b.w=Math.min(Math.max(min,b.w+dx),W-b.x); }
      if(drag.h.includes("t")){ const ny=Math.min(Math.max(0,b.y+dy),b.y+b.h-min); b.h+=b.y-ny; b.y=ny; }
      if(drag.h.includes("b")){ b.h=Math.min(Math.max(min,b.h+dy),H-b.y); }
    }
    crop.box=b; drawBox();
  });
  const end=()=>{ drag=null; }; box.addEventListener("pointerup",end); box.addEventListener("pointercancel",end);
  // 枠の外をなぞると、新しく囲み直せる
  const area=$("#cropArea");
  area.addEventListener("pointerdown",e=>{ if(e.target!==area&&e.target!==$("#cropImg")) return; e.preventDefault(); area.setPointerCapture(e.pointerId); const p=pt(e); drag={h:"new",o:p}; });
  area.addEventListener("pointermove",e=>{ if(!drag||drag.h!=="new") return; const p=pt(e), W=crop.img.naturalWidth, H=crop.img.naturalHeight;
    const x0=Math.max(0,Math.min(drag.o.x,p.x)), y0=Math.max(0,Math.min(drag.o.y,p.y)), x1=Math.min(W,Math.max(drag.o.x,p.x)), y1=Math.min(H,Math.max(drag.o.y,p.y));
    if(x1-x0>20/view.s&&y1-y0>20/view.s){ crop.box={x:x0,y:y0,w:x1-x0,h:y1-y0}; drawBox(); } });
  area.addEventListener("pointerup",end); area.addEventListener("pointercancel",end);
})();
$("#cropAdd").onclick=async()=>{
  if(!crop) return;
  $("#cropAdd").disabled=true;
  try{
    const [,q]=cropOpts(), c=cropCanvas(), blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    if(!crop.pageId){ crop.pageId="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await pagePut({id:crop.pageId,blob:await compress(crop.file),created:Date.now()}); }
    await dbPut(newCard(blob,await thumbOf(blob),crop.pageId,$("#cropMemo").value.trim()));
    ls.set("pr_lastSubj",$("#subj").value.trim());
    crop.added++; $("#cropMemo").value="";
    toast(t("cropAdded",{n:crop.added}));
  }finally{ $("#cropAdd").disabled=false; }
};
$("#cropDone").onclick=()=>{ if(cropQueue.length) nextCrop(); else closeCrop(); };
$("#cropCancel").onclick=()=>closeCrop();
$("#cropRetake").onclick=()=>{ cropQueue=[]; $("#cropper").classList.remove("on"); crop=null; $("#camFile").click(); };
function renderSubjects(){
  const list=subjects();
  $("#subjList").innerHTML=list.map(s=>`<option value="${esc(s)}">`).join("");
  const box=$("#subjChips"); box.innerHTML="";
  list.slice(0,10).forEach(s=>{const b=document.createElement("button"); b.className="chip"+($("#subj").value===s?" on":""); b.textContent=s;
    b.onclick=()=>{$("#subj").value=s; renderSubjects();}; box.appendChild(b);});
}
$("#subj").oninput=renderSubjects;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 一覧 ===== */
function renderFilter(){
  const f=$("#filter"), cur=f.value||"__all";
  f.innerHTML=`<option value="__all">${t("all")}</option><option value="__due">${t("dueOnly")}</option><option value="__master">${t("masterOnly")}</option>`+
    subjects().map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
  f.value=[...f.options].some(o=>o.value===cur)?cur:"__all";
}
$("#filter").onchange=renderGrid;
function filtered(){
  const v=$("#filter").value;
  return cards.filter(c=>v==="__all"||(v==="__due"&&isDue(c))||(v==="__master"&&c.mastered)||c.subject===v);
}
function renderGrid(){
  const g=$("#grid"); g.innerHTML=""; const list=filtered();
  $("#listEmpty").style.display=cards.length?"none":"block";
  list.forEach(c=>{
    const b=document.createElement("button"); b.className="tile"+(c.mastered?" master":"");
    b.innerHTML=`<img src="${c.thumb}" alt="">${isDue(c)?'<span class="due"></span>':""}<span class="lv">${esc(c.subject||"")} ${dueLabel(c)}</span>`;
    b.onclick=()=>openSheet(c); g.appendChild(b);
  });
}
async function openSheet(c){
  const pg=c.a?null:await pageGet(c.pageId);
  const qURL=URL.createObjectURL(c.q), aURL=c.a?URL.createObjectURL(c.a):(pg?URL.createObjectURL(pg.blob):null);
  const iv=intervals();
  $("#sheetInner").innerHTML=`
    <img src="${qURL}" alt="">${aURL?`<img src="${aURL}" alt="">`:""}
    <div class="field"><label>${t("subject")}</label><input id="eSubj" value="${esc(c.subject||"")}"></div>
    <div class="field"><label>${t("memo")}</label><textarea id="eMemo" rows="2">${esc(c.memo||"")}</textarea></div>
    <p class="muted">${t("level")}: ${c.mastered?"★":(c.level+1)+" / "+iv.length} ・ ${t("nextDue")}: ${dueLabel(c)}</p>
    <div class="row"><button class="btn" id="eSave">${t("edit")}</button><button class="btn pri" id="eNow">${t("reviewNow")}</button></div>
    <div class="row"><button class="btn" id="eReset">${t("reset")}</button><button class="btn ng" id="eDel">${t("del")}</button><button class="btn" id="eClose">${t("close")}</button></div>`;
  $("#sheet").classList.add("on");
  const close=()=>{$("#sheet").classList.remove("on"); URL.revokeObjectURL(qURL); aURL&&URL.revokeObjectURL(aURL);};
  $("#eClose").onclick=close;
  $("#sheet").onclick=e=>{if(e.target.id==="sheet") close();};
  $("#eSave").onclick=async()=>{c.subject=$("#eSubj").value.trim(); c.memo=$("#eMemo").value.trim(); await dbPut(c); close(); reload();};
  $("#eNow").onclick=()=>{close(); startReview([c],true);};
  $("#eReset").onclick=async()=>{c.level=0;c.mastered=false;c.due=startOfDay()+DAY; await dbPut(c); close(); reload();};
  $("#eDel").onclick=async()=>{if(!confirm(t("confirmDel"))) return; await delCard(c); close(); reload();};
}

/* ===== 復習 ===== */
let queue=[], qi=0, practice=false, showingAns=false, curURL=null;
const gradeStack=[];   // 押し間違いを取り消すための記録
$("#startReview").onclick=()=>startReview(shuffle(cards.filter(isDue)),false);
$("#listReview").onclick=()=>startReview(shuffle(filtered()),true);
$("#extraReview").onclick=()=>startReview(shuffle(filtered().length?filtered():cards.slice()),true);
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function startReview(list,isPractice){
  if(!list.length){toast(t("nothing")); return;}
  queue=list; qi=0; practice=isPractice; $("#rvUndo").disabled=true;
  $("#reviewer").classList.add("on"); showCard();
}
function showCard(){
  const c=queue[qi]; showingAns=false;
  $("#rvCount").textContent=t("count",{a:qi+1,b:queue.length});
  setImg(c.q);
  $("#rvAnswer").style.display=(c.a||c.pageId)?"":"none"; $("#rvAnswer").textContent=t(c.a?"showAns":"page");
  $("#rvMeta").innerHTML=(c.subject?`<span class="subj">${esc(c.subject)}</span>`:"")+esc(c.memo||"");
  $("#rvOkSub").textContent=practice?"":nextInfo(c,true).label;
  $("#rvNgSub").textContent=practice?"":nextInfo(c,false).label;
}
function setImg(blob){
  if(curURL) URL.revokeObjectURL(curURL); curURL=URL.createObjectURL(blob);
  const img=$("#rvImg"); img.classList.remove("zoom"); img.src=curURL; $("#rvImgWrap").scrollTo(0,0);
}
$("#rvImg").ondblclick=e=>e.target.classList.toggle("zoom");
$("#rvAnswer").onclick=async()=>{
  const c=queue[qi]; showingAns=!showingAns;
  if(c.a){ setImg(showingAns?c.a:c.q); $("#rvAnswer").textContent=t(showingAns?"showQ":"showAns"); return; }
  const pg=showingAns?await pageGet(c.pageId):null;
  setImg(pg?pg.blob:c.q); if(!pg) showingAns=false;
  $("#rvAnswer").textContent=t(showingAns?"showCrop":"page");
};
$("#rvOk").onclick=()=>grade(true);
$("#rvNg").onclick=()=>grade(false);
$("#rvClose").onclick=endReview;
async function grade(ok){
  const c=queue[qi];
  gradeStack.push({c,qi,practice,prev:{level:c.level,due:c.due,mastered:c.mastered,reviews:c.reviews,last:c.last}});
  if(gradeStack.length>50) gradeStack.shift();
  $("#rvUndo").disabled=false;
  if(!practice){
    const n=nextInfo(c,ok); Object.assign(c,{level:n.level,due:n.due===Infinity?8.64e15:n.due,mastered:n.mastered,reviews:(c.reviews||0)+1,last:Date.now()});
    await dbPut(c);
  }
  qi++;
  if(qi>=queue.length){ endReview(); toast(t("doneAll")); } else showCard();
}
async function undoGrade(){
  const g=gradeStack.pop(); if(!g){ toast(t("undoNone")); return false; }
  if(!g.practice){ Object.assign(g.c,g.prev); await dbPut(g.c); }
  $("#rvUndo").disabled=!gradeStack.length;
  if($("#reviewer").classList.contains("on")&&queue[g.qi]===g.c){ qi=g.qi; showCard(); }
  toast(t("undone")); return true;
}
$("#rvUndo").onclick=()=>undoGrade();
$("#undoBtn").onclick=async()=>{ if(await undoGrade()) reload(); };
function endReview(){ $("#reviewer").classList.remove("on"); if(curURL){URL.revokeObjectURL(curURL); curURL=null;} reload(); }

/* ===== リマインダー（カレンダー .ics） ===== */
function pad(n){return String(n).padStart(2,"0");}
function icsDate(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;}
function icsStamp(){const d=new Date(); return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;}
function icsEvent(uid,start,extra=""){
  const end=new Date(start.getTime()+15*60000);
  const url=location.href.split("#")[0].split("?")[0]+"#review";
  return ["BEGIN:VEVENT",`UID:${uid}@45tools-recall`,`DTSTAMP:${icsStamp()}`,`DTSTART:${icsDate(start)}`,`DTEND:${icsDate(end)}`,
    extra,`SUMMARY:${t("calTitle")}`,`DESCRIPTION:${t("calDesc")}\\n${url}`,`URL:${url}`,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t("calTitle")}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].filter(Boolean).join("\r\n");
}
function icsWrap(events){return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//45tools//45Recall//JA","CALSCALE:GREGORIAN",...events,"END:VCALENDAR"].join("\r\n");}
function reminderStart(dayMs){
  const [h,m]=($("#remTime").value||"20:00").split(":").map(Number);
  const d=new Date(dayMs); d.setHours(h,m,0,0); return d;
}
$("#remTime").value=ls.get("pr_time")||"20:00";
$("#remTime").onchange=e=>ls.set("pr_time",e.target.value);
$("#icsDaily").onclick=()=>{
  let s=reminderStart(startOfDay()); if(s<new Date()) s=reminderStart(startOfDay()+DAY);
  saveFile(icsWrap([icsEvent("daily",s,"RRULE:FREQ=DAILY")]),"45recall-daily.ics","text/calendar");
};
$("#icsDates").onclick=()=>{
  const days=new Set(), lim=startOfDay()+31*DAY;
  cards.forEach(c=>{ if(!c.mastered){ const d=Math.max(startOfDay(new Date(c.due)),startOfDay()); if(d<lim) days.add(d);} });
  if(!days.size){toast(t("nothing")); return;}
  const evs=[...days].sort().map(d=>icsEvent("d"+d,reminderStart(d)));
  saveFile(icsWrap(evs),"45recall-schedule.ics","text/calendar");
};
function saveFile(text,name,type){
  const blob=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},30000);
}

/* ===== アイコンバッジ ===== */
function setBadge(n){ if(ls.get("pr_badge")!=="1"||!navigator.setAppBadge) return; (n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(()=>{}); }
$("#notifBtn").onclick=async()=>{
  if(!navigator.setAppBadge||!("Notification" in window)){ toast(t("badgeNg")); return; }
  try{ const p=await Notification.requestPermission(); if(p==="granted"){ ls.set("pr_badge","1"); toast(t("badgeOk")); refreshAll(); } else toast(t("badgeNg")); }
  catch(e){ toast(t("badgeNg")); }
};

/* ===== 設定・バックアップ ===== */
$("#intervals").onchange=e=>{
  const v=e.target.value.split(/[,、\s]+/).map(s=>parseInt(s,10)).filter(n=>n>0);
  ls.set("pr_int",(v.length?v:DEFAULT_INTERVALS).join(",")); refreshAll();
};
$("#qSel").onchange=e=>ls.set("pr_q",e.target.value);
$("#delMastered").onclick=async()=>{
  const ms=cards.filter(c=>c.mastered); if(!ms.length) return;
  if(!confirm(t("confirmDelM",{n:ms.length}))) return;
  for(const c of ms) await delCard(c);
  toast(t("deletedN",{n:ms.length})); reload();
};
$("#lang").onchange=e=>{lang=e.target.value; ls.set("pr_lang",lang); applyLang();};
const b2d=b=>new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);});
const d2b=async d=>(await fetch(d)).blob();
$("#backup").onclick=async()=>{
  const out=[]; for(const c of cards) out.push({...c,q:await b2d(c.q),a:c.a?await b2d(c.a):null});
  const name=`45recall-backup-${new Date().toISOString().slice(0,10)}.json`;
  const pages=[]; for(const p of await pageAll()) pages.push({id:p.id,created:p.created,blob:await b2d(p.blob)});
  const json=JSON.stringify({app:"photorecall",v:2,intervals:intervals(),cards:out,pages});
  const file=new File([json],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; } }
  saveFile(json,name,"application/json");
};
$("#restoreFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); let n=0;
    for(const p of data.pages||[]){ await pagePut({id:p.id,created:p.created,blob:await d2b(p.blob)}); }
    for(const c of data.cards||[]){ c.q=await d2b(c.q); c.a=c.a?await d2b(c.a):null; await dbPut(c); n++; }
    toast(t("restored",{n})); reload();
  }catch(err){ alert("Error: "+err.message); }
};

function toast(msg){const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2200);}

/* ===== 起動 ===== */
$("#supportLink").href=SUPPORT_URL;
$("#subj").value=ls.get("pr_lastSubj")||"";
(async()=>{
  await openDB();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  setMode(ls.get("pr_mode")||"review");
  applyLang(); await reload();
  if(location.hash==="#review" && cards.some(isDue)) $("#startReview").click();
})();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&db) reload(); });
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__pr={get cards(){return cards},reload,nextInfo,startOfDay};
</script>
