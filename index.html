<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="45 Recall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>45 Recall</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fff; --line:#e4dfd3; --text:#22201b; --sub:#7a7468;
  --accent:#2f6fde; --ok:#1f9d6b; --ng:#e0524a; --warn:#e8a33a; --chip:#efeadf;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16171a;--card:#212328;--line:#33363d;--text:#eceae5;--sub:#9b978e;--chip:#2b2e34}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang SC",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(72px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{display:flex;align-items:center;padding:12px 16px 6px}
header h1{margin:0;font-size:18px}
header h1 small{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px}
main{max-width:640px;margin:0 auto;padding:0 14px}
section{display:none} section.on{display:block}
h2{font-size:15px;margin:16px 2px 10px;color:var(--sub);font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:none;border-radius:12px;padding:12px 16px;background:var(--chip);font-size:15px;font-weight:600}
.btn.pri{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ng{background:var(--ng);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.98)}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.big-num{font-size:44px;font-weight:800;line-height:1}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:11px;color:var(--sub)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);position:relative}
nav button .ic{font-size:21px;line-height:1.1}
nav button.on{color:var(--accent);font-weight:700}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--ng);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}

/* add */
.shot{display:flex;gap:10px}
.shot label{flex:1;border:2px dashed var(--line);border-radius:14px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:13px;position:relative;overflow:hidden;background:var(--bg)}
.shot label .ic{font-size:30px}
.shot label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{display:none}
.field{margin-top:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border:none;border-radius:16px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--accent);color:#fff}

/* review */
#reviewer{position:fixed;inset:0;background:#0d0d0f;color:#fff;z-index:30;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#reviewer.on{display:flex}
.rv-top{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px}
.rv-top .sp{flex:1}
.rv-top button{background:rgba(255,255,255,.12);border:none;border-radius:10px;padding:6px 12px;color:#fff}
.rv-img{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.rv-img img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .15s}
.rv-img img.zoom{max-width:none;max-height:none;width:200%}
.rv-meta{padding:6px 16px;font-size:14px;color:#ddd}
.rv-meta .subj{display:inline-block;background:rgba(255,255,255,.15);border-radius:10px;padding:2px 10px;margin-right:6px;font-size:12px}
.rv-btns{display:flex;gap:10px;padding:10px 14px 14px}
.rv-btns .btn{flex:1;padding:16px 8px;font-size:16px}
.rv-btns .btn small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:2px}

/* list */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--chip);border:none;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lv{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:6px;padding:1px 6px}
.tile .due{position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--ng);border:2px solid #fff}
.tile.master::after{content:"★";position:absolute;right:6px;top:4px;color:#ffd24d;font-size:16px;text-shadow:0 0 3px #000}

/* detail modal */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
#sheet.on{display:flex}
#sheet .inner{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
#sheet img{width:100%;border-radius:12px;display:block;margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1}
.support{display:block;text-align:center;border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:10px;text-decoration:none;font-size:14px}
.brand{text-align:center;color:var(--sub);font-size:11px;margin:14px 0}
.empty{text-align:center;padding:30px 10px}
.empty .ic{font-size:44px}
</style>
</head>
<body>
<header><h1>45 Recall<small>by 45tools</small></h1></header>
<main>
  <!-- 今日 -->
  <section id="tab-today" class="on">
    <div class="box" style="text-align:center">
      <div class="muted" data-i="dueToday"></div>
      <div class="big-num" id="dueNum">0</div>
      <div style="height:12px"></div>
      <button class="btn pri full" id="startReview" data-i="start"></button>
      <div style="height:8px"></div>
      <button class="btn full" id="extraReview" data-i="extra"></button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span data-i="sTotal"></span></div>
      <div class="stat"><b id="sTomorrow">0</b><span data-i="sTomorrow"></span></div>
      <div class="stat"><b id="sMaster">0</b><span data-i="sMaster"></span></div>
    </div>
    <h2 data-i="howTitle"></h2>
    <div class="box muted" id="howText"></div>
  </section>

  <!-- 追加 -->
  <section id="tab-add">
    <h2 data-i="addTitle"></h2>
    <div class="box">
      <div class="shot">
        <label id="qLabel"><span class="ic">📷</span><span data-i="qPhoto"></span><input type="file" id="qFile" accept="image/*" capture="environment"></label>
        <label id="aLabel"><span class="ic">💡</span><span data-i="aPhoto"></span><input type="file" id="aFile" accept="image/*" capture="environment"></label>
      </div>
      <div class="field"><label data-i="subject"></label>
        <input id="subj" list="subjList" autocomplete="off"><datalist id="subjList"></datalist>
        <div class="chips" id="subjChips"></div>
      </div>
      <div class="field"><label data-i="memo"></label><textarea id="memo" rows="2"></textarea></div>
      <div style="height:12px"></div>
      <button class="btn pri full" id="saveCard" data-i="save" disabled></button>
      <p class="muted" data-i="addNote" style="margin:10px 2px 0"></p>
    </div>
    <div class="box">
      <label class="btn full" style="display:block;text-align:center"><span data-i="bulk"></span><input type="file" id="bulkFile" accept="image/*" multiple hidden></label>
    </div>
  </section>

  <!-- 一覧 -->
  <section id="tab-list">
    <div class="field" style="margin-top:12px"><select id="filter"></select></div>
    <div style="height:10px"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="listEmpty"><div class="ic">🗂</div><p class="muted" data-i="noCards"></p></div>
  </section>

  <!-- 設定 -->
  <section id="tab-set">
    <h2 data-i="remindTitle"></h2>
    <div class="box">
      <p class="muted" data-i="remindText" style="margin-top:0"></p>
      <div class="field"><label data-i="remindTime"></label><input type="time" id="remTime" value="20:00"></div>
      <div style="height:12px"></div>
      <button class="btn pri full" id="icsDaily" data-i="icsDaily"></button>
      <div style="height:8px"></div>
      <button class="btn full" id="icsDates" data-i="icsDates"></button>
      <div style="height:8px"></div>
      <button class="btn full" id="notifBtn" data-i="badge"></button>
    </div>
    <h2 data-i="intTitle"></h2>
    <div class="box">
      <div class="field" style="margin-top:0"><label data-i="intLabel"></label><input id="intervals" inputmode="numeric"></div>
      <p class="muted" data-i="intText"></p>
    </div>
    <h2 data-i="dataTitle"></h2>
    <div class="box">
      <div class="field" style="margin-top:0"><label data-i="qLabel"></label>
        <select id="qSel"><option value="std" data-i="qStd"></option><option value="high" data-i="qHigh"></option><option value="eco" data-i="qEco"></option></select></div>
      <p class="muted" id="usage"></p>
      <button class="btn full" id="delMastered"></button>
      <div style="height:8px"></div>
      <button class="btn full" id="backup" data-i="backup"></button>
      <div style="height:8px"></div>
      <label class="btn full" style="display:block;text-align:center"><span data-i="restore"></span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
      <p class="muted" data-i="dataText"></p>
    </div>
    <h2>Language / 言語 / 語言</h2>
    <div class="box"><select id="lang" class="field" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)">
      <option value="ja">日本語</option><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh">简体中文</option></select></div>
    <a class="support" id="supportLink" target="_blank" rel="noopener" data-i="support"></a>
    <div class="brand">© 45tools</div>
  </section>
</main>

<nav>
  <button data-tab="today" class="on"><span class="ic">🔁</span><span data-i="navToday"></span><span class="badge" id="navBadge" hidden>0</span></button>
  <button data-tab="add"><span class="ic">📷</span><span data-i="navAdd"></span></button>
  <button data-tab="list"><span class="ic">🗂</span><span data-i="navList"></span></button>
  <button data-tab="set"><span class="ic">⚙︎</span><span data-i="navSet"></span></button>
</nav>

<div id="reviewer">
  <div class="rv-top"><span id="rvCount"></span><span class="sp"></span><button id="rvAnswer" data-i="showAns"></button><button id="rvClose" data-i="close"></button></div>
  <div class="rv-img" id="rvImgWrap"><img id="rvImg" alt=""></div>
  <div class="rv-meta" id="rvMeta"></div>
  <div class="rv-btns">
    <button class="btn ng" id="rvNg"><span data-i="ng"></span><small id="rvNgSub"></small></button>
    <button class="btn ok" id="rvOk"><span data-i="ok"></span><small id="rvOkSub"></small></button>
  </div>
</div>

<div id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

/* ===== IndexedDB ===== */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("photorecall",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("cards",{keyPath:"id"});
    r.onsuccess=()=>{db=r.result;res()}; r.onerror=()=>rej(r.error);
  });
}
const tx=(mode)=>db.transaction("cards",mode).objectStore("cards");
const dbAll=()=>new Promise(r=>{const q=tx("readonly").getAll(); q.onsuccess=()=>r(q.result||[]);});
const dbPut=c=>new Promise((r,j)=>{const q=tx("readwrite").put(c); q.onsuccess=()=>r(); q.onerror=()=>j(q.error);});
const dbDel=id=>new Promise(r=>{const q=tx("readwrite").delete(id); q.onsuccess=()=>r();});

/* ===== 日付・スケジュール ===== */
const DAY=86400000;
function startOfDay(d=new Date()){const x=new Date(d); x.setHours(0,0,0,0); return x.getTime();}
function intervals(){
  const v=(ls.get("pr_int")||"").split(",").map(s=>parseInt(s,10)).filter(n=>n>0);
  return v.length?v:DEFAULT_INTERVALS;
}
const isDue=c=>!c.mastered && c.due<=startOfDay()+DAY-1;
function nextInfo(c,ok){
  const iv=intervals();
  if(!ok) return {level:0,due:startOfDay()+DAY,mastered:false,label:t("tomorrow")};
  const lv=c.level+1;
  if(lv>=iv.length) return {level:lv,due:Infinity,mastered:true,label:t("mastered")};
  return {level:lv,due:startOfDay()+iv[lv]*DAY,mastered:false,label:t("nextIn",{n:iv[lv]})};
}
function dueLabel(c){
  if(c.mastered) return "★";
  const d=Math.round((startOfDay(new Date(c.due))-startOfDay())/DAY);
  return d<0?t("overdue"):d===0?t("today"):t("days",{n:d});
}

/* ===== 画像処理 ===== */
function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{res(img); setTimeout(()=>URL.revokeObjectURL(url),1000)}; img.onerror=rej; img.src=url;
  });
}
async function compress(file,max,q,gray){
  if(max===undefined) [max,q,gray]=qset();
  const img=await loadImage(file);
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
  if(gray){ const d=ctx.getImageData(0,0,c.width,c.height), a=d.data;
    for(let i=0;i<a.length;i+=4){ const y=a[i]*.299+a[i+1]*.587+a[i+2]*.114; a[i]=a[i+1]=a[i+2]=y; }
    ctx.putImageData(d,0,0); }
  return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q));
}
async function thumbOf(blob){
  const b=await compress(blob,360,.7);
  return new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);});
}

function openSheet(c){

    <div class="row"><button class="btn" id="eSave">${t("edit")}</button><button class="btn pri" id="eNow">${t("reviewNow")}</button></div>
    <div class="row"><button class="btn" id="eReset">${t("reset")}</button><button class="btn ng" id="eDel">${t("del")}</button><button class="btn" id="eClose">${t("close")}</button></div>`;

  const close=()=>{$("#sheet").classList.remove("on"); URL.revokeObjectURL(qURL); aURL&&URL.revokeObjectURL(aURL);};

}

function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}

/* ===== リマインダー（カレンダー .ics） ===== */
function pad(n){return String(n).padStart(2,"0");}
function icsDate(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;}
function icsStamp(){const d=new Date(); return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;}
function icsEvent(uid,start,extra=""){
  const end=new Date(start.getTime()+15*60000);
  const url=location.href.split("#")[0].split("?")[0]+"#review";
  return ["BEGIN:VEVENT",`UID:${uid}@45tools-recall`,`DTSTAMP:${icsStamp()}`,`DTSTART:${icsDate(start)}`,`DTEND:${icsDate(end)}`,
    extra,`SUMMARY:${t("calTitle")}`,`DESCRIPTION:${t("calDesc")}\\n${url}`,`URL:${url}`,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t("calTitle")}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].filter(Boolean).join("\r\n");
}
function icsWrap(events){return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//45tools//45Recall//JA","CALSCALE:GREGORIAN",...events,"END:VCALENDAR"].join("\r\n");}
function reminderStart(dayMs){
  const [h,m]=($("#remTime").value||"20:00").split(":").map(Number);
  const d=new Date(dayMs); d.setHours(h,m,0,0); return d;
}
$("#remTime").value=ls.get("pr_time")||"20:00";
$("#remTime").onchange=e=>ls.set("pr_time",e.target.value);
$("#icsDaily").onclick=()=>{
  let s=reminderStart(startOfDay()); if(s<new Date()) s=reminderStart(startOfDay()+DAY);
  saveFile(icsWrap([icsEvent("daily",s,"RRULE:FREQ=DAILY")]),"45recall-daily.ics","text/calendar");
};
$("#icsDates").onclick=()=>{
  const days=new Set(), lim=startOfDay()+31*DAY;
  cards.forEach(c=>{ if(!c.mastered){ const d=Math.max(startOfDay(new Date(c.due)),startOfDay()); if(d<lim) days.add(d);} });
  if(!days.size){toast(t("nothing")); return;}
  const evs=[...days].sort().map(d=>icsEvent("d"+d,reminderStart(d)));
  saveFile(icsWrap(evs),"45recall-schedule.ics","text/calendar");
};
function saveFile(text,name,type){
  const blob=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},30000);
}

  if(!confirm(t("confirmDelM",{n:ms.length}))) return;
  for(const c of ms) await dbDel(c.id);
  toast(t("deletedN",{n:ms.length})); reload();
};
$("#lang").onchange=e=>{lang=e.target.value; ls.set("pr_lang",lang); applyLang();};
const b2d=b=>new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);});
const d2b=async d=>(await fetch(d)).blob();
$("#backup").onclick=async()=>{
  const out=[]; for(const c of cards) out.push({...c,q:await b2d(c.q),a:c.a?await b2d(c.a):null});
  const name=`45recall-backup-${new Date().toISOString().slice(0,10)}.json`;
  const json=JSON.stringify({app:"photorecall",v:1,intervals:intervals(),cards:out});
  const file=new File([json],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; } }
  saveFile(json,name,"application/json");
};
$("#restoreFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); let n=0;
    for(const c of data.cards||[]){ c.q=await d2b(c.q); c.a=c.a?await d2b(c.a):null; await dbPut(c); n++; }
    toast(t("restored",{n})); reload();
  }catch(err){ alert("Error: "+err.message); }
};

function toast(msg){const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2200);}

/* ===== 起動 ===== */
$("#supportLink").href=SUPPORT_URL;
$("#subj").value=ls.get("pr_lastSubj")||"";
(async()=>{
  await openDB();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  applyLang(); await reload();
  if(location.hash==="#review" && cards.some(isDue)) $("#startReview").click();
})();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&db) reload(); });
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__pr={get cards(){return cards},reload,nextInfo,startOfDay};
</script>
